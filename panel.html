<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SideKick</title>
<style>
* { box-sizing: border-box; }
body { font-family:-apple-system,system-ui,sans-serif; margin:0; padding:16px; color:#15192b;
  background:#ffffff; position:relative; min-height:100vh; overflow-x:hidden; }

/* ===== Aurora: vivid light-blue, no blur filter (crisp color pools) ===== */
.aurora { position:fixed; inset:-10%; z-index:-1; pointer-events:none; opacity:0.95;
  background-repeat:no-repeat;
  background-image:
    radial-gradient(60% 50% at 18% 0%, rgba(56,189,248,0.80), transparent 68%),
    radial-gradient(55% 48% at 65% 6%, rgba(96,165,250,0.72), transparent 70%),
    radial-gradient(52% 42% at 92% 0%, rgba(125,211,252,0.70), transparent 72%),
    radial-gradient(82% 58% at 45% 3%, rgba(59,130,246,0.62), transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 96%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 96%);
  animation:aurora 16s ease-in-out infinite alternate; }
@keyframes aurora { 0%{transform:translateX(-6%) scale(1.06);} 100%{transform:translateX(7%) scale(1.16);} }
@media (prefers-reduced-motion:reduce){ .aurora{animation:none;} }

/* ===== Glass panel (light) ===== */
.panel { background:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.7); border-radius:24px; padding:16px;
  box-shadow:0 8px 30px rgba(30,64,140,0.12);
  -webkit-backdrop-filter:blur(30px) saturate(1.4); backdrop-filter:blur(30px) saturate(1.4); }

/* ===== Header + day groups (single scrollable page) ===== */
.apptitle { font-size:20px; font-weight:700; letter-spacing:.3px; color:#15192b; }
.appsub { font-size:12px; color:#5b6478; margin:2px 0 4px; }
.date-title { font-size:13px; font-weight:700; letter-spacing:.5px; color:#3457c7; margin:16px 2px 8px; }
.daygroup:first-of-type .date-title { margin-top:10px; }
/* scroll-driven reveal: each day group opens up + rises as it scrolls in (MacBook-scroll feel) */
.daygroup { transform-origin:center top; scroll-margin-top:14px; animation:reveal linear both;
  animation-timeline:view(); animation-range:entry 2% cover 20%; }
@keyframes reveal {
  from { opacity:0; transform:perspective(900px) rotateX(16deg) translateY(26px) scale(0.95); }
  to   { opacity:1; transform:perspective(900px) rotateX(0deg) translateY(0) scale(1); }
}
@media (prefers-reduced-motion:reduce){ .daygroup{ animation:none; } }

/* ===== Match rows ===== */
.match { position:relative; display:flex; justify-content:space-between; align-items:center;
  background:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.6); border-radius:12px;
  padding:10px 14px 10px 16px; margin-bottom:8px; overflow:hidden; cursor:pointer; transition:background .15s ease, transform .18s ease-out; will-change:transform; }
.match:hover { background:rgba(255,255,255,0.85); }
.match::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:#3b82f6; }
.match .title { font-weight:600; font-size:15px; color:#15192b; }
.match .right { text-align:right; flex-shrink:0; margin-left:10px; }
.match .t1 { font-size:13px; font-weight:600; color:#15192b; }
.match .t2 { font-size:12px; color:#6b7280; margin-top:2px; }
.ampm { font-size:9px; font-weight:600; }
.footer { text-align:center; font-size:13px; color:#6b7280; margin-top:8px; }
.empty { padding:24px 12px; text-align:center; color:#5b6478; line-height:1.6; }
#back { background:rgba(255,255,255,0.6); color:#15192b; border:1px solid rgba(255,255,255,0.7); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px; margin-bottom:10px;
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); }

/* ===== Pitch: light glass tactics board ===== */
.pitch { position:relative; background:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.65);
  border-radius:20px; padding:12px; overflow:hidden; box-shadow:0 8px 30px rgba(30,64,140,0.12);
  -webkit-backdrop-filter:blur(26px) saturate(1.3); backdrop-filter:blur(26px) saturate(1.3);
  transition:transform .2s ease-out; will-change:transform; }
.pitch::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:78px; height:78px; border:1.5px solid rgba(30,60,120,0.22); border-radius:50%; pointer-events:none; }
.half { display:flex; flex-direction:column; gap:14px; padding:8px 6px; }
.prow { display:flex; justify-content:space-around; gap:2px; }
.halfline { height:2px; background:rgba(30,60,120,0.22); margin:2px 8px; }
.teamlabel { text-align:center; font-size:12px; font-weight:700; color:#15192b; margin:2px 0 4px; letter-spacing:.3px; position:relative; z-index:1; }
.pchip { display:flex; flex-direction:column; align-items:center; width:52px; cursor:pointer; position:relative; z-index:1; }
.jersey { width:30px; height:30px; border-radius:50%; font-weight:700; font-size:13px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(20,30,60,0.28); }
.home .jersey { background:#1d2b50; color:#fff; }
.away .jersey { background:#e63946; color:#fff; }
.pname { font-size:10px; margin-top:3px; text-align:center; color:#15192b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52px; }
.hint { text-align:center; font-size:12px; color:#5b6478; margin-top:10px; }

/* ===== Player card (glass overlay, light) ===== */
#pcard-overlay { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:rgba(20,40,90,0.18); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
.pcard { position:relative; width:252px; padding:16px 18px 18px; border-radius:24px; text-align:center;
  background:rgba(255,255,255,0.92); border:1px solid rgba(255,255,255,0.9); box-shadow:0 18px 50px rgba(30,64,140,0.28);
  transform-style:preserve-3d; transition:transform .2s ease-out; will-change:transform; }
.pcard-loading { padding:24px 0; color:#5b6478; }
.pcard-close { position:absolute; top:10px; right:12px; background:none; border:none; color:#5b6478; font-size:15px; cursor:pointer; }
.pcard-num { width:52px; height:52px; border-radius:50%; margin:4px auto 10px; display:flex; align-items:center; justify-content:center;
  background:#1d2b50; font-size:22px; font-weight:700; color:#fff; }
.pcard-name { font-size:18px; font-weight:700; color:#15192b; }
.pcard-sub { font-size:13px; color:#5b6478; margin-top:2px; }
.pcard-sec { text-align:left; font-size:11px; font-weight:600; letter-spacing:.6px; color:#3457c7; margin:14px 0 8px; }
.capbadge { font-size:10px; background:#e6a23c; color:#15192b; padding:2px 6px; border-radius:5px; margin-left:4px; vertical-align:middle; }
.tiles { display:flex; gap:8px; }
.tile { flex:1; background:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.7); border-radius:14px; padding:12px 4px 10px; text-align:center; }
.tile .num { font-size:22px; font-weight:700; color:#15192b; }
.tile .lbl { font-size:11px; color:#5b6478; margin-top:2px; }
.statrow { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.7); border-radius:12px; padding:11px 14px; margin-top:8px; }
.statrow .l { font-size:13px; color:#5b6478; }
.statrow .v { font-size:14px; font-weight:600; color:#15192b; }
</style>
</head>
<body>
<div class="aurora"></div>
<div id="content">Loading…</div>
<script src="panel.js"></script>
</body>
</html>
